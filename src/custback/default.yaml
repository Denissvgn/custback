# custback default configuration
# Start with: custback -c config/default.yaml
#
# Versionless and schema-1 files retain these compatibility defaults.
# Camera cover, linear-sRGB blending, automatic color correction, and advanced
# matte controls require explicit selection. Inspect effective runtime status
# after changes; optional backends and presets do not establish a quality or
# physical-camera performance guarantee. See docs/visual-configuration.md and
# docs/matte-configuration.md for configuration and rollback guidance.

schema_version: 1

camera:
  device: 0            # index, /dev/videoN, or capture URL
  width: 1280
  height: 720
  fps: 30
  pixel_format: auto    # auto | mjpeg | backend; auto requests MJPG on V4L2
  mode_mismatch: warn   # warn | error when the negotiated mode misses the target
  recovery_timeout_s: 10.0  # terminal outage limit after the last valid frame
  # cover preserves proportions and crops; contain preserves proportions and
  # adds black bars; stretch fills by distorting. A mismatched legacy stretch
  # emits one upgrade note per capture lifetime before a future staged default.
  fit_mode: stretch     # cover | contain | stretch; schema-1 compatibility
  anchor_x: 0.5         # 0 = left, 1 = right (used by proportional fit modes)
  anchor_y: 0.5         # 0 = top, 1 = bottom
  rotation: 0           # 0 | 90 | 180 | 270, applied before mirror and fit
  mirror: false
  synthetic: false     # true = built-in test pattern (no hardware needed)

background:
  # passthrough | blur | image | video | color | camera | remote
  mode: blur
  blur_strength: 31
  image_path: ""       # static backdrop (mode: image)
  video_path: ""       # looping live backdrop (mode: video)
  # Metadata-aware video decode resolves these from frame/container tags.
  # Override only for a reproducible local asset with known declarations;
  # never infer range or matrix from its histogram. Supported tagged SDR is
  # normalized to full-range sRGB BGR; untagged video uses the observable
  # schema-1 BT.709/full/BT.709/sRGB assumption. Unsupported HDR/wide-gamut
  # declarations are rejected.
  video_color_matrix: auto    # auto | bt601 | bt709
  video_color_range: auto     # auto | limited | full
  video_color_primaries: auto # auto | bt709 | bt470bg | smpte170m
  video_color_transfer: auto  # auto | srgb | bt709
  camera_device: ""    # legacy startup-only local device (mode: camera)
  camera_target: ""    # hot-selectable ID from operator-owned backdrop_targets
  color: [18, 100, 32] # BGR (mode: color)
  fit_mode: cover       # cover | contain | stretch
  anchor_x: 0.5         # focal point for crop/pad: 0 = left, 1 = right
  anchor_y: 0.5         # 0 = top, 1 = bottom
  # Local mode restored when remote/avatar mode is disabled. Renderer outages
  # always emit the fixed privacy slate, regardless of this preference.
  # blur | image | video | color | camera (never passthrough or remote)
  remote_fallback_mode: blur

# Immutable live-backdrop authority. Sources are startup-only local OpenCV
# devices/paths; remote URL schemes are rejected because OpenCV cannot enforce
# verified TLS, redirect, proxy, and address-class policy.
backdrop_targets: {}

segmentation:
  # Existing schema-1 compatibility selector: auto tries rvm (matting, needs
  # the [rvm] or [gpu] extra) > mediapipe > heuristic. This is not a new RVM
  # default promotion or a claim that every detected provider is sustainable.
  backend: auto        # auto | rvm | mediapipe | heuristic | none
  model_path: ""       # optional model override (.onnx for rvm, .tflite for mediapipe)
  delegate: cpu        # cpu | gpu — mediapipe inference device; rvm picks
                       # CUDA automatically when onnxruntime-gpu is installed
  rvm_downsample: 0.0  # rvm internal resolution ratio, 0 = auto from frame size
  threshold: 0.5       # heuristic backend only; ignored by rvm/mediapipe
  mask_blur: 7         # edge feathering (odd kernel, 0 = off)
  edge_refine: true    # compatibility/master switch for spatial edge refinement
  spatial_edge_refinement:
    mode: legacy_watershed  # legacy_watershed | stable_guided (opt-in)
    reference_short_edge_px: 720
    radius_at_reference_px: 8
    min_radius_px: 2
    max_radius_px: 12
  mask_shift: 0        # grow (>0) / shrink (<0) mask by N px; -1..-2 removes halos
  temporal_smoothing: 0.35  # compatibility EMA; unchanged when policy below is off
  boundary_stabilization:
    mode: "off"        # off | motion_aware (experimental; requires qualification)
    time_constant_s: 0.1
    max_motion_px_per_s: 720.0

# RVM inference acceleration policy (onnxruntime execution provider).
# Independent of segmentation.delegate above, which only selects MediaPipe's
# CPU/GPU delegate. GPU registration alone is not trusted: auto mode proves the
# provider can actually execute RVM before using it, and latches to CPU if not.
acceleration:
  mode: auto           # auto | cpu | gpu_required
                       #   auto         = try GPU, prove it, else fall back to CPU
                       #   cpu          = CPUExecutionProvider only (never a GPU)
                       #   gpu_required = fail startup unless GPU execution is proven
  provider: auto       # auto | cuda | directml — auto tries platform GPU providers
  device_id: 0         # adapter index when more than one accelerator is present

compositing:
  light_wrap: 0.25     # 0..1, backdrop light bleeding into the person's edge
  use_model_foreground: true  # rvm only: color-spill removal on hair/edges
  # linear_srgb performs correction, clean-foreground replacement, light wrap,
  # and alpha blending in linear light. srgb_legacy retains encoded blending.
  blend_space: srgb_legacy    # srgb_legacy | linear_srgb; schema-1 compatibility
  light_wrap_stabilization:
    # Explicit qualification candidate for changing video/camera wrap samples.
    # Off preserves the historical stateless light-wrap pixels.
    mode: "off"               # off | temporal_bounded
    time_constant_s: 0.12     # inert while mode is off
  color_correction:
    # auto is eligible only for image/video/camera backdrops. Passthrough,
    # blur, solid color, and remote output remain identity; low confidence is
    # an observable identity/hold/decay outcome, not an error.
    mode: "off"               # off | auto; schema-1 compatibility
    strength: 0.5             # 0..1
    exposure_limit_ev: 0.85   # 0..1 EV
    white_balance_strength: 0.5  # 0..1
    adaptation_time_s: 0.8    # 0.05..10 seconds

output:
  # The canonical canvas is distinct from camera acquisition. Both dimensions
  # must be set together; two nulls use the requested camera size.
  width: null
  height: null
  backend: auto        # auto | pyvirtualcam | native (Win11 MF camera) | null (API-only)
  device: ""           # e.g. /dev/video10 on Linux; empty = auto
  fps: 30
  preview: false       # on-screen window with the processed output (q/ESC quits)

api:
  enabled: true
  host: 127.0.0.1
  port: 8710
  remote_timeout_ms: 250   # avatar-mode freshness before falling back
  allow_non_loopback: false
  # Loopback origins are derived from host/port when this is empty. Remote
  # binds require explicit exact origins such as https://studio.example:8710.
  allowed_origins: []
  token_file: ~/.config/custback/api-token
  # Dedicated credential accepted only by the raw-frame renderer WebSocket.
  # custback provisions it; renderer clients only load an existing file.
  renderer_token_file: ~/.config/custback/renderer-token
  session_ttl_s: 28800     # browser session lifetime: eight hours
  tls_certfile: ""         # both TLS paths are mandatory for non-loopback
  tls_keyfile: ""
  ws_max_bytes: 16777216
  max_stream_connections: 16 # shared cap for authenticated MJPEG/WebSocket clients
  uploads:
    image_max_bytes: 20971520
    video_max_bytes: 268435456
    image_max_pixels: 16777216
    video_max_width: 3840
    video_max_height: 2160
    storage_max_bytes: 2147483648
    max_files: 100

avatar:
  # The custback-avatar control API behind the web UI's /avatar/* proxy.
  # Empty url disables the proxy. Destination, credential, and TLS trust are
  # immutable startup settings; changes require restarting custback. Plaintext
  # is accepted only on numeric loopback. CUSTBACK_AVATAR_API_TOKEN overrides
  # the avatar service's existing control-token file. Omit token_file to use
  # the platform config directory (~/.config/custback on POSIX,
  # %APPDATA%\Custback on Windows).
  url: ""                        # http://127.0.0.1:8711 or https://gb10:8711
  tls_ca_file: ""                # optional private CA bundle for HTTPS
  tls_certfile: ""               # optional mTLS client certificate (pair required)
  tls_keyfile: ""                # optional mTLS client private key (never exposed)
  connect_timeout_s: 3.0
  read_timeout_s: 30.0
