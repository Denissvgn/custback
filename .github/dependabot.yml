version: 2
# Routine version bumps are deferred for the initial source publication.
# A zero limit does not disable security updates.
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: nuget
    directory: /packaging/windows/shell
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
