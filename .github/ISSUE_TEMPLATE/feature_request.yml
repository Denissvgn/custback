name: Feature request
description: Describe a user problem or a missing capability.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe your workflow, platform, and who would benefit.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Explain what success looks like and any alternatives you have tried.
    validations:
      required: true
