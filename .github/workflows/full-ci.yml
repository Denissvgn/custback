name: Full validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Scan Git history for credentials
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --log-opts="--all" --redact=100 --no-banner
      - name: Audit installed runtime dependencies
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/security-env"
          "$RUNNER_TEMP/security-env/bin/python" -m pip install --upgrade 'pip>=23,<27'
          "$RUNNER_TEMP/security-env/bin/python" -m pip install -e . 'pip-audit==2.10.1'
          "$RUNNER_TEMP/security-env/bin/python" -m pip check
          "$RUNNER_TEMP/security-env/bin/python" -m pip_audit --strict --skip-editable

  python-timing:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip check
      - name: Measure complete suite with existing per-test limits
        run: python -m pytest -q --timeout-method=signal --durations=30

  windows-source:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade 'pip>=23,<27'
      - run: python -m pip install -e '.[dev,windows]'
      - run: python -m pip check
      - run: custback --help
      - run: custback avatar --smoke --no-file-log
      - name: Exercise Windows source and storage contracts
        run: >-
          python -m pytest -q
          tests/test_platform_seam.py
          tests/test_windows_vcam.py
          tests/test_windows_packaging.py
          tests/test_camera_devices.py
          tests/test_gpu_probe.py
          tests/test_video_color.py
          tests/test_config.py
          tests/test_config_merge.py
          tests/test_geometry.py
          tests/test_cadence.py
          tests/test_output_scheduler.py
          tests/test_runtime_performance.py

  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade 'pip>=23,<27'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip check
      - run: python -m ruff check src tests examples scripts/release
      - run: python -m ruff format --check src tests examples scripts/release

  pyright:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install --upgrade 'pip>=23,<27'
      - run: .venv/bin/python -m pip install -e '.[dev]'
      - run: .venv/bin/python -m pip check
      - run: .venv/bin/python -m pyright

  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade 'pip>=23,<27'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip check
      - run: timeout 180s python -m pytest -q tests/test_phase6_stress.py
        env:
          CUSTBACK_STRESS_ITERATIONS: "100"
          CUSTBACK_STRESS_SEED: "0xC057BAC6"

  visual-qualification-deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade 'pip>=23,<27'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip check
      - name: Run the 10,000-frame deterministic visual contract
        run: >-
          python scripts/release/visual_consistency_qualification.py run
          --output "${{ runner.temp }}/visual-qualification.json"
          --contact-sheet "${{ runner.temp }}/visual-contact-sheet.png"
      - name: Revalidate the emitted evidence independently
        run: >-
          python scripts/release/visual_consistency_qualification.py validate
          --report "${{ runner.temp }}/visual-qualification.json"
          --claim deterministic
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-qualification-deterministic
          path: |
            ${{ runner.temp }}/visual-qualification.json
            ${{ runner.temp }}/visual-contact-sheet.png
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false

  python-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade 'pip>=23,<27'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip check
      - run: timeout 180s python -m pytest -q
      - if: matrix.python-version == '3.12'
        run: node scripts/release/verify-release.js --regressions=pytest

  opencv-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - opencv: "opencv-contrib-python==4.8.1.78"
            numpy: "numpy>=1.24,<2"
          - opencv: "opencv-contrib-python>=5,<6"
            numpy: "numpy>=2,<3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade 'pip>=23,<27'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip install --upgrade --force-reinstall '${{ matrix.numpy }}' '${{ matrix.opencv }}'
      - run: >-
          timeout 120s python -m pytest -q
          tests/test_geometry.py
          tests/test_background_geometry.py
          tests/test_capture.py
          tests/test_capture_geometry.py
          tests/test_color.py
          tests/test_video_color.py
          tests/test_processing.py
          tests/test_pipeline.py
          tests/test_canonical_canvas.py
          tests/test_output_geometry.py
          tests/test_visual_consistency_e2e.py
          tests/test_visual_consistency_qualification.py

  dependency-bounds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: minimum
            python-version: "3.10"
          - profile: newest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade 'pip>=23,<27'
      - if: matrix.profile == 'minimum'
        run: >-
          python -m pip install
          'numpy==1.24.0'
          'opencv-contrib-python==4.8.1.78'
          'av==17.1.0'
          'pillow==12.3.0'
          'pydantic==2.9.0'
          'pyvirtualcam==0.11.0'
          'fastapi==0.139.0'
          'starlette==1.3.1'
          'uvicorn==0.29.0'
          'pyyaml==6.0'
          'websockets==12.0'
          'python-multipart==0.0.32'
          'build==1.2.1'
          'pytest==8.0.0'
          'pytest-timeout==2.3.1'
          'httpx==0.27.0'
          'httpx2>=2,<3'
      - if: matrix.profile == 'minimum'
        run: python -m pip install --no-deps -e .
      - if: matrix.profile == 'newest'
        run: python -m pip install --upgrade --upgrade-strategy eager -e '.[dev]'
      - run: python -m pip check
      - run: timeout 180s python -m pytest -q

  optional-backends:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            extra: mediapipe
          - python-version: "3.12"
            extra: mediapipe
          - python-version: "3.12"
            extra: rvm
          - python-version: "3.11"
            extra: rvm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade 'pip>=23,<27'
      - run: python -m pip install -e '.[dev,${{ matrix.extra }}]'
      - run: python -m pip check
      - run: timeout 180s python -m pytest -q

  audio2face-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        install-kind: [source, wheel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade 'pip>=23,<27' 'build>=1.2,<2'
      - if: matrix.install-kind == 'source'
        run: python -m pip install '.[dev,audio2face]'
      - if: matrix.install-kind == 'wheel'
        run: |
          python -m build --wheel --outdir dist
          wheel="$(find dist -maxdepth 1 -name 'custback-*.whl' -print -quit)"
          test -n "$wheel"
          python -m pip install "${wheel}[dev,audio2face]"
      - run: python -m pip check
      - run: >-
          timeout 180s python -m pytest -q
          tests/test_audio2face_protocol.py
          tests/test_avatar_drivers.py::test_audio2face_driver_requires_bindings
          tests/test_avatar_api.py::test_audio2face_wav_availability_does_not_require_microphone

  windows-native-vcam:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build exact-mode Media Foundation virtual camera
        shell: pwsh
        run: ./packaging/windows/vcam/build.ps1 -Arch x64
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade 'pip>=23,<27'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip check
      - name: Qualify tagged video color normalization on Windows FFmpeg
        run: python -m pytest -q tests/test_video_color.py

  windows-frozen-engine:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Freeze and smoke x64 CPU/vision payload
        shell: pwsh
        run: >-
          ./packaging/windows/pyinstaller/build.ps1
          -Arch x64
          -Extras "rvm,mediapipe,windows"
          -AvatarProfile vision

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: ["18.15.0", "20", "22"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: CUSTBACK_SKIP_INSTALL=1 npm ci --ignore-scripts
      - run: npm test
      - if: matrix.node-version == '18.15.0'
        run: node scripts/release/verify-release.js --regressions=node
  package-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: python -m pip install --upgrade 'pip>=23,<27' 'build>=1.2,<2'
      - run: node scripts/release/package-smoke.js
        env:
          CUSTBACK_RELEASE_TMPDIR: ${{ runner.temp }}
