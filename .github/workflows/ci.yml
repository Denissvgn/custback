name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade 'pip>=23,<27'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip check
      - run: timeout 180s python -m pytest -q

  opencv-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - opencv: "opencv-contrib-python==4.8.1.78"
            numpy: "numpy>=1.24,<2"
          - opencv: "opencv-contrib-python>=5,<6"
            numpy: "numpy>=2,<3"
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade 'pip>=23,<27'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip install --upgrade --force-reinstall '${{ matrix.numpy }}' '${{ matrix.opencv }}'
      - run: timeout 120s python -m pytest -q tests/test_processing.py tests/test_pipeline.py

  dependency-bounds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: minimum
            python-version: "3.10"
          - profile: newest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade 'pip>=23,<27'
      - if: matrix.profile == 'minimum'
        run: >-
          python -m pip install
          'numpy==1.24.0'
          'opencv-contrib-python==4.8.1.78'
          'pillow==10.0.0'
          'pydantic==2.7.0'
          'pyvirtualcam==0.11.0'
          'fastapi==0.110.0'
          'uvicorn==0.29.0'
          'pyyaml==6.0'
          'websockets==12.0'
          'python-multipart==0.0.9'
          'build==1.2.1'
          'pytest==8.0.0'
          'pytest-timeout==2.3.1'
          'httpx==0.27.0'
          'httpx2>=2,<3'
      - if: matrix.profile == 'minimum'
        run: python -m pip install --no-deps -e .
      - if: matrix.profile == 'newest'
        run: python -m pip install --upgrade --upgrade-strategy eager -e '.[dev]'
      - run: python -m pip check
      - run: timeout 180s python -m pytest -q

  optional-backends:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            extra: mediapipe
          - python-version: "3.12"
            extra: mediapipe
          - python-version: "3.12"
            extra: rvm
          - python-version: "3.11"
            extra: rvm
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade 'pip>=23,<27'
      - run: python -m pip install -e '.[dev,${{ matrix.extra }}]'
      - run: python -m pip check
      - run: timeout 180s python -m pytest -q

  audio2face-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        install-kind: [source, wheel]
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade 'pip>=23,<27' 'build>=1.2,<2'
      - if: matrix.install-kind == 'source'
        run: python -m pip install '.[dev,audio2face]'
      - if: matrix.install-kind == 'wheel'
        run: |
          python -m build --wheel --outdir dist
          wheel="$(find dist -maxdepth 1 -name 'custback-*.whl' -print -quit)"
          test -n "$wheel"
          python -m pip install "${wheel}[dev,audio2face]"
      - run: python -m pip check
      - run: >-
          timeout 180s python -m pytest -q
          tests/test_audio2face_protocol.py
          tests/test_avatar_drivers.py::test_audio2face_driver_requires_bindings
          tests/test_avatar_api.py::test_audio2face_wav_availability_does_not_require_microphone

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: CUSTBACK_SKIP_INSTALL=1 npm ci --ignore-scripts
      - run: npm test
      - run: npm pack --dry-run --json

  package-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: python -m pip install --upgrade 'pip>=23,<27' 'build>=1.2,<2'
      - run: npm run release:check
        env:
          CUSTBACK_RELEASE_TMPDIR: ${{ runner.temp }}
