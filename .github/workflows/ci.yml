name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - name: Install core and focused verification tools
        run: >-
          python -m pip install -e .
          'pytest>=8,<10' 'pytest-timeout>=2.3,<3'
          'httpx2>=2,<3' 'ruff==0.15.22' 'pip-audit==2.10.1'
      - run: python -m pip check
      - run: python -m ruff check src tests examples scripts/release
      - run: python -m ruff format --check src tests examples scripts/release
      - name: Focused core, security, and recovery regressions
        run: >-
          timeout 180s python -m pytest -q
          tests/test_public_documentation.py
          tests/test_package_candidate.py
          tests/test_config.py
          tests/test_config_merge.py
          tests/test_api_security.py
          tests/test_remediation_security.py
          tests/test_remediation_runtime.py
          tests/test_output_scheduler.py
          tests/test_background_asset_fallback.py
          tests/test_matte_diagnostics.py
          tests/test_pipeline.py::test_hot_patch_repeat_keeps_committed_and_pixel_config_versions_distinct
          tests/test_pipeline.py::test_operator_matte_mitigations_apply_confirm_and_rollback
          tests/test_api.py::test_upload_rejects_oversized_part_headers_and_releases_storage
      - run: custback --help
      - run: custback avatar --smoke
      - name: Remove generated editable-build metadata
        run: python -c "import shutil; shutil.rmtree('src/custback.egg-info', ignore_errors=True)"
      - run: CUSTBACK_SKIP_INSTALL=1 npm ci --ignore-scripts
      - run: npm test
      - run: npm run release:check -- --quick
      - name: Audit every installed third-party dependency
        shell: bash
        run: |
          python -m pip freeze --all --exclude-editable > "$RUNNER_TEMP/audit-requirements.txt"
          python -m pip_audit --strict --no-deps --disable-pip --requirement "$RUNNER_TEMP/audit-requirements.txt"
      - name: Scan complete Git history for credentials
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --log-opts="--all" --redact=100 --no-banner

  source-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-latest]
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install . 'pytest>=8,<10' 'pytest-timeout>=2.3,<3'
      - run: python -m pip check
      - run: custback --help
      - run: custback avatar --smoke
      - name: Check configuration and native filesystem security
        run: >-
          python -m pytest -q
          tests/test_config.py
          tests/test_config_merge.py
          tests/test_platform_seam.py
