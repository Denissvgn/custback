name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade 'pip>=23,<27'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip check
      - run: timeout 180s python -m pytest -q

  opencv-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - opencv: "opencv-contrib-python==4.8.1.78"
            numpy: "numpy>=1.24,<2"
          - opencv: "opencv-contrib-python>=5,<6"
            numpy: "numpy>=2,<3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade 'pip>=23,<27'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip install --upgrade --force-reinstall '${{ matrix.numpy }}' '${{ matrix.opencv }}'
      - run: timeout 120s python -m pytest -q tests/test_processing.py tests/test_pipeline.py

  dependency-bounds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: minimum
            python-version: "3.10"
          - profile: newest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade 'pip>=23,<27'
      - if: matrix.profile == 'minimum'
        run: >-
          python -m pip install
          'numpy==1.24.0'
          'opencv-contrib-python==4.8.1.78'
          'pillow==10.0.0'
          'pydantic==2.7.0'
          'pyvirtualcam==0.11.0'
          'fastapi==0.110.0'
          'uvicorn==0.29.0'
          'pyyaml==6.0'
          'websockets==12.0'
          'python-multipart==0.0.9'
          'build==1.2.1'
          'pytest==8.0.0'
          'pytest-timeout==2.3.1'
          'httpx==0.27.0'
          'httpx2>=2,<3'
      - if: matrix.profile == 'minimum'
        run: python -m pip install --no-deps -e .
      - if: matrix.profile == 'newest'
        run: python -m pip install --upgrade --upgrade-strategy eager -e '.[dev]'
      - run: python -m pip check
      - run: timeout 180s python -m pytest -q

  optional-backends:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            extra: mediapipe
          - python-version: "3.12"
            extra: mediapipe
          - python-version: "3.12"
            extra: rvm
          - python-version: "3.11"
            extra: rvm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade 'pip>=23,<27'
      - run: python -m pip install -e '.[dev,${{ matrix.extra }}]'
      - run: python -m pip check
      - run: timeout 180s python -m pytest -q

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: CUSTBACK_SKIP_INSTALL=1 npm install --ignore-scripts
      - run: npm test
      - run: npm pack --dry-run --json

  package-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python -m pip install --upgrade 'pip>=23,<27' 'build>=1.2,<2'
      - run: npm run release:check
