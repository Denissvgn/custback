name: package-candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.repository == 'Denissvgn/custback' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install build tools
        run: python -m pip install 'build>=1.2,<2' 'twine>=6,<7'
      - name: Build the immutable candidate once
        run: node scripts/release/build-candidate.js --output "$RUNNER_TEMP/candidate"
      - name: Verify candidate identity and package metadata
        run: |
          python scripts/release/package-candidate.py verify --candidate "$RUNNER_TEMP/candidate"
          python -m twine check --strict "$RUNNER_TEMP"/candidate/*.whl "$RUNNER_TEMP"/candidate/*.tar.gz
      - name: Attest packages and candidate manifest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-path: ${{ runner.temp }}/candidate/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-package-candidate
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          retention-days: 30

  artifact-smoke:
    name: artifact-smoke (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-latest]
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: core-package-candidate
          path: ${{ runner.temp }}/candidate
      - name: Install and exercise the exact downloaded packages
        run: >-
          python scripts/release/package-candidate.py smoke
          --candidate "${{ runner.temp }}/candidate"
          --report "${{ runner.temp }}/reports/${{ runner.os }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-package-smoke-${{ runner.os }}
          path: ${{ runner.temp }}/reports
          if-no-files-found: error
          retention-days: 30

  qualify:
    needs: [build, artifact-smoke]
    if: ${{ always() && needs.build.result == 'success' && needs.artifact-smoke.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: core-package-candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: core-package-smoke-*
          path: ${{ runner.temp }}/reports
          merge-multiple: true
      - name: Verify provenance and source CI for this commit
        run: |
          for artifact in "$RUNNER_TEMP"/candidate/*; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/package-candidate.yml" \
              --signer-digest "$GITHUB_SHA" --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" --deny-self-hosted-runners
          done
          gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
            --json databaseId,headSha,headBranch,event,conclusion,url --limit 20 > "$RUNNER_TEMP/source-ci.json"
      - name: Join all host evidence and write checksums
        run: >-
          python scripts/release/package-candidate.py qualify
          --candidate "$RUNNER_TEMP/candidate" --reports "$RUNNER_TEMP/reports"
          --source-ci "$RUNNER_TEMP/source-ci.json"
          --report "$RUNNER_TEMP/qualification/qualification.json"
      - name: Attest the bounded qualification result
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-path: ${{ runner.temp }}/qualification/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-package-qualification
          path: ${{ runner.temp }}/qualification
          if-no-files-found: error
          retention-days: 30
      - name: Record the handoff
        run: |
          echo '## Core package candidate verified' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download core-package-candidate and core-package-qualification from this run.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No tags, registry uploads, or GitHub Release were created. Qualification covers the explicit core profile only; see qualification.json for deferred checks.' >> "$GITHUB_STEP_SUMMARY"
