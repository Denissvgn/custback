        with:
          name: custback-release-candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: Install the exact candidate and qualification dependencies
        shell: bash
        run: |
          wheel="$(find "$RUNNER_TEMP/candidate" -maxdepth 1 -type f -name '*.whl' -print -quit)"
          python -m pip install --disable-pip-version-check "${wheel}[dev]"
          python -m pip check
      - name: Run and revalidate the 10,000-frame deterministic contract
        run: |
          python scripts/release/visual_consistency_qualification.py run \
            --output "$RUNNER_TEMP/visual-qualification.json" \
            --contact-sheet "$RUNNER_TEMP/visual-contact-sheet.png"
          python scripts/release/visual_consistency_qualification.py validate \
            --report "$RUNNER_TEMP/visual-qualification.json" \
            --claim deterministic
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: visual-qualification-deterministic
          path: |
            ${{ runner.temp }}/visual-qualification.json
            ${{ runner.temp }}/visual-contact-sheet.png
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false

