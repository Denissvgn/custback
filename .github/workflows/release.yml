name: phase6-release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: phase6-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CUSTBACK_RELEASE_TIMEOUT_MS: "1800000"
  CUSTBACK_RELEASE_BUILD_JOBS: "2"
  CUSTBACK_STRESS_ITERATIONS: "100"
  CUSTBACK_STRESS_SEED: "0xC057BAC6"

jobs:
  artifact-build:
    name: Build immutable release candidate
    if: ${{ github.repository == 'Denissvgn/custback' && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && github.ref_protected)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Install candidate builder
        run: python -m pip install --disable-pip-version-check "build>=1.2,<2"
      - name: Build once through the authorizing prepack path
        run: node scripts/release/build-candidate.js --output "$RUNNER_TEMP/candidate"
      - name: Attest all three exact candidate artifacts
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            ${{ runner.temp }}/candidate/*.whl
            ${{ runner.temp }}/candidate/*.tar.gz
            ${{ runner.temp }}/candidate/*.tgz
      - name: Upload exact candidate files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: custback-release-candidate
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
      - name: Build the unpublished 0.3 source-reference artifacts once
        shell: bash
        env:
          REFERENCE_COMMIT: 099001e9f25a3ea1d0c820b066a6318e4172d549
        run: |
          mkdir -p "$RUNNER_TEMP/reference-source" "$RUNNER_TEMP/reference"
          git cat-file -e "${REFERENCE_COMMIT}^{commit}"
          git archive --format=tar --output="$RUNNER_TEMP/reference-source.tar" "$REFERENCE_COMMIT"
          tar -xf "$RUNNER_TEMP/reference-source.tar" -C "$RUNNER_TEMP/reference-source"
          rm -f "$RUNNER_TEMP/reference-source.tar"
          python -m build --sdist --wheel --outdir "$RUNNER_TEMP/reference" "$RUNNER_TEMP/reference-source"
          npm pack "$RUNNER_TEMP/reference-source" --ignore-scripts --pack-destination "$RUNNER_TEMP/reference"
          test -f "$RUNNER_TEMP/reference/custback-0.3.0-py3-none-any.whl"
          test -f "$RUNNER_TEMP/reference/custback-0.3.0.tar.gz"
          test -f "$RUNNER_TEMP/reference/custback-0.3.0.tgz"
          shopt -s nullglob
          reference_files=("$RUNNER_TEMP/reference"/*)
          test "${#reference_files[@]}" -eq 3
      - name: Upload explicitly unpublished source-reference artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: custback-unpublished-reference-0.3.0
          path: ${{ runner.temp }}/reference
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false

  python-core:
    name: Python ${{ matrix.id }}
    needs: [artifact-build]
    runs-on: ${{ matrix.os == 'ubuntu' && 'ubuntu-latest' || 'macos-latest' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ubuntu-python-3.10
            os: ubuntu
            python: "3.10"
          - id: ubuntu-python-3.11
            os: ubuntu
            python: "3.11"
          - id: ubuntu-python-3.12
            os: ubuntu
            python: "3.12"
          - id: ubuntu-python-3.13
            os: ubuntu
            python: "3.13"
          - id: ubuntu-python-3.14
            os: ubuntu
            python: "3.14"
          - id: macos-python-3.12
            os: macos
            python: "3.12"
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: custback-release-candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Validate candidate provenance and files
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/candidate
        run: >-
          node -e 'const fs=require("fs"),path=require("path"),p=require("./scripts/release/phase6-evidence"),a=require("./scripts/release/assemble-evidence"),d=process.env.CANDIDATE_DIR,c=JSON.parse(fs.readFileSync(path.join(d,"candidate-manifest.json"))),m=p.loadManifest();a.validateCandidate(c,m,process.env);p.verifyArtifactFiles(c.artifacts,p.artifactPathsFromDirectory(c,d));'
      - name: Run the full suite from the downloaded wheel
        shell: bash
        run: |
          wheel="$(find "$RUNNER_TEMP/candidate" -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          python -m pip install --disable-pip-version-check "${wheel}[dev]"
          python -m pip check
          python -m pytest -q

  opencv-compatibility:
    name: OpenCV ${{ matrix.id }}
    needs: [artifact-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: opencv-4-numpy-1
            opencv: "opencv-contrib-python==4.8.1.78"
            numpy: "numpy>=1.24,<2"
          - id: opencv-5-numpy-2
            opencv: "opencv-contrib-python>=5,<6"
            numpy: "numpy>=2,<3"
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: custback-release-candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: Validate candidate provenance and files
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/candidate
        run: >-
          node -e 'const fs=require("fs"),path=require("path"),p=require("./scripts/release/phase6-evidence"),a=require("./scripts/release/assemble-evidence"),d=process.env.CANDIDATE_DIR,c=JSON.parse(fs.readFileSync(path.join(d,"candidate-manifest.json"))),m=p.loadManifest();a.validateCandidate(c,m,process.env);p.verifyArtifactFiles(c.artifacts,p.artifactPathsFromDirectory(c,d));'
      - shell: bash
        run: |
          wheel="$(find "$RUNNER_TEMP/candidate" -maxdepth 1 -type f -name '*.whl' -print -quit)"
          python -m pip install --disable-pip-version-check "${wheel}[dev]"
          python -m pip install --disable-pip-version-check --force-reinstall "${{ matrix.numpy }}" "${{ matrix.opencv }}"
          python -m pip check
          python -m pytest -q \
            tests/test_geometry.py \
            tests/test_background_geometry.py \
            tests/test_capture.py \
            tests/test_capture_geometry.py \
            tests/test_color.py \
            tests/test_video_color.py \
            tests/test_processing.py \
            tests/test_pipeline.py \
            tests/test_canonical_canvas.py \
            tests/test_output_geometry.py \
            tests/test_visual_consistency_e2e.py \
            tests/test_visual_consistency_qualification.py

  dependency-bounds:
    name: Dependency bounds ${{ matrix.id }}
    needs: [artifact-build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: minimum-python-3.10
            python: "3.10"
            upgrade: "false"
          - id: newest-python-3.12
            python: "3.12"
            upgrade: "true"
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: custback-release-candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: Validate candidate provenance and files
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/candidate
        run: >-
          node -e 'const fs=require("fs"),path=require("path"),p=require("./scripts/release/phase6-evidence"),a=require("./scripts/release/assemble-evidence"),d=process.env.CANDIDATE_DIR,c=JSON.parse(fs.readFileSync(path.join(d,"candidate-manifest.json"))),m=p.loadManifest();a.validateCandidate(c,m,process.env);p.verifyArtifactFiles(c.artifacts,p.artifactPathsFromDirectory(c,d));'
      - shell: bash
        run: |
          wheel="$(find "$RUNNER_TEMP/candidate" -maxdepth 1 -type f -name '*.whl' -print -quit)"
          if [ "${{ matrix.upgrade }}" = true ]; then
            python -m pip install --disable-pip-version-check --upgrade --upgrade-strategy eager "${wheel}[dev]"
          else
            python -m pip install --disable-pip-version-check "${wheel}[dev]"
          fi
          python -m pip check
          python -m pytest -q

  optional-backends:
    name: Optional backend ${{ matrix.id }}
    needs: [artifact-build]
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: mediapipe-python-3.11-wheel
            runner: '["ubuntu-latest"]'
            python: "3.11"
            extra: mediapipe
            artifact: wheel
            command: >-
              python -m pytest -q
              tests/test_geometry.py tests/test_background_geometry.py
              tests/test_capture.py tests/test_capture_geometry.py
              tests/test_color.py tests/test_video_color.py
              tests/test_processing.py tests/test_pipeline.py
              tests/test_canonical_canvas.py tests/test_output_geometry.py
              tests/test_visual_consistency_e2e.py
              tests/test_visual_consistency_qualification.py
          - id: mediapipe-python-3.12-wheel
            runner: '["ubuntu-latest"]'
            python: "3.12"
            extra: mediapipe
            artifact: wheel
            command: >-
              python -m pytest -q
              tests/test_geometry.py tests/test_background_geometry.py
              tests/test_capture.py tests/test_capture_geometry.py
              tests/test_color.py tests/test_video_color.py
              tests/test_processing.py tests/test_pipeline.py
              tests/test_canonical_canvas.py tests/test_output_geometry.py
              tests/test_visual_consistency_e2e.py
              tests/test_visual_consistency_qualification.py
          - id: rvm-python-3.11-wheel
            runner: '["ubuntu-latest"]'
            python: "3.11"
            extra: rvm
            artifact: wheel
            command: >-
              python -m pytest -q
              tests/test_geometry.py tests/test_background_geometry.py
              tests/test_capture.py tests/test_capture_geometry.py
              tests/test_color.py tests/test_video_color.py
              tests/test_processing.py tests/test_pipeline.py
              tests/test_canonical_canvas.py tests/test_output_geometry.py
              tests/test_visual_consistency_e2e.py
              tests/test_visual_consistency_qualification.py
              tests/test_segmentation_rvm.py
          - id: rvm-python-3.12-wheel
            runner: '["ubuntu-latest"]'
            python: "3.12"
            extra: rvm
            artifact: wheel
            command: >-
              python -m pytest -q
              tests/test_geometry.py tests/test_background_geometry.py
              tests/test_capture.py tests/test_capture_geometry.py
              tests/test_color.py tests/test_video_color.py
              tests/test_processing.py tests/test_pipeline.py
              tests/test_canonical_canvas.py tests/test_output_geometry.py
              tests/test_visual_consistency_e2e.py
              tests/test_visual_consistency_qualification.py
              tests/test_segmentation_rvm.py
          - id: audio2face-python-3.12-source
            runner: '["ubuntu-latest"]'
            python: "3.12"
            extra: audio2face
            artifact: sdist
            command: python -m pytest -q tests/test_audio2face_protocol.py
          - id: audio2face-python-3.12-wheel
            runner: '["ubuntu-latest"]'
            python: "3.12"
            extra: audio2face
            artifact: wheel
            command: python -m pytest -q tests/test_audio2face_protocol.py
          - id: gpu-python-3.12-linux-x86_64-resolution
            runner: '["ubuntu-latest"]'
            python: "3.12"
            extra: gpu
            artifact: wheel
            command: python -c 'import importlib.metadata as m; print(m.version("onnxruntime-gpu"))'
          - id: cuda-python-3.12-linux-x86_64-execution
            runner: '["self-hosted","linux","x64","gpu","cuda"]'
            python: "3.12"
            extra: gpu
            artifact: wheel
            command: python -c 'import json,subprocess,sys; r=json.loads(subprocess.check_output([sys.executable,"-m","custback.gpu_probe","--json"])); assert r["cuda_inference"], r'
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: custback-release-candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: Validate candidate provenance and files
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/candidate
        run: >-
          node -e 'const fs=require("fs"),path=require("path"),p=require("./scripts/release/phase6-evidence"),a=require("./scripts/release/assemble-evidence"),d=process.env.CANDIDATE_DIR,c=JSON.parse(fs.readFileSync(path.join(d,"candidate-manifest.json"))),m=p.loadManifest();a.validateCandidate(c,m,process.env);p.verifyArtifactFiles(c.artifacts,p.artifactPathsFromDirectory(c,d));'
      - name: Install reviewed optional contract
        shell: bash
        run: |
          if [ "${{ matrix.artifact }}" = wheel ]; then
            artifact="$(find "$RUNNER_TEMP/candidate" -maxdepth 1 -type f -name '*.whl' -print -quit)"
          else
            artifact="$(find "$RUNNER_TEMP/candidate" -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          fi
          test -n "$artifact"
          python -m pip install --disable-pip-version-check "${artifact}[${{ matrix.extra }},dev]"
          python -m pip check
      - name: Execute real optional contract
        run: ${{ matrix.command }}

  audio2face-contract:
    name: Audio2Face ${{ matrix.install-kind }}
    needs: [artifact-build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        install-kind: [source, wheel]
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: custback-release-candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: Validate candidate provenance and files
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/candidate
        run: >-
          node -e 'const fs=require("fs"),path=require("path"),p=require("./scripts/release/phase6-evidence"),a=require("./scripts/release/assemble-evidence"),d=process.env.CANDIDATE_DIR,c=JSON.parse(fs.readFileSync(path.join(d,"candidate-manifest.json"))),m=p.loadManifest();a.validateCandidate(c,m,process.env);p.verifyArtifactFiles(c.artifacts,p.artifactPathsFromDirectory(c,d));'
      - shell: bash
        run: |
          if [ "${{ matrix.install-kind }}" = wheel ]; then
            artifact="$(find "$RUNNER_TEMP/candidate" -maxdepth 1 -type f -name '*.whl' -print -quit)"
          else
            artifact="$(find "$RUNNER_TEMP/candidate" -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          fi
          python -m pip install --disable-pip-version-check "${artifact}[audio2face,dev]"
          python -m pip check
          python -m pytest -q tests/test_audio2face_protocol.py tests/test_avatar_drivers.py::test_audio2face_driver_requires_bindings tests/test_avatar_api.py::test_audio2face_wav_availability_does_not_require_microphone

  node:
    name: Node ${{ matrix.id }}
    needs: [artifact-build]
    runs-on: ${{ matrix.os == 'ubuntu' && 'ubuntu-latest' || 'macos-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ubuntu-node-18
            os: ubuntu
            node: "18.15.0"
          - id: ubuntu-node-20
            os: ubuntu
            node: "20"
          - id: ubuntu-node-22
            os: ubuntu
            node: "22"
          - id: macos-node-20
            os: macos
            node: "20"
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: custback-release-candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - name: Validate candidate provenance and files
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/candidate
        run: >-
          node -e 'const fs=require("fs"),path=require("path"),p=require("./scripts/release/phase6-evidence"),a=require("./scripts/release/assemble-evidence"),d=process.env.CANDIDATE_DIR,c=JSON.parse(fs.readFileSync(path.join(d,"candidate-manifest.json"))),m=p.loadManifest();a.validateCandidate(c,m,process.env);p.verifyArtifactFiles(c.artifacts,p.artifactPathsFromDirectory(c,d));'
      - name: Run npm tests from the downloaded tarball
        shell: bash
        run: |
          tarball="$(find "$RUNNER_TEMP/candidate" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          mkdir -p "$RUNNER_TEMP/npm-artifact"
          CUSTBACK_SKIP_INSTALL=1 npm install --ignore-scripts --prefix "$RUNNER_TEMP/npm-artifact" "$tarball"
          node --test "$RUNNER_TEMP/npm-artifact/node_modules/custback/packaging/npm/test/"*.test.js

  package-smoke:
    name: Package smoke ${{ matrix.os }}
    needs: [artifact-build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: custback-release-candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: Validate candidate provenance and files
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/candidate
        run: >-
          node -e 'const fs=require("fs"),path=require("path"),p=require("./scripts/release/phase6-evidence"),a=require("./scripts/release/assemble-evidence"),d=process.env.CANDIDATE_DIR,c=JSON.parse(fs.readFileSync(path.join(d,"candidate-manifest.json"))),m=p.loadManifest();a.validateCandidate(c,m,process.env);p.verifyArtifactFiles(c.artifacts,p.artifactPathsFromDirectory(c,d));'
      - name: Smoke installed launchers
        shell: bash
        run: |
          wheel="$(find "$RUNNER_TEMP/candidate" -maxdepth 1 -type f -name '*.whl' -print -quit)"
          tarball="$(find "$RUNNER_TEMP/candidate" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install --disable-pip-version-check "$wheel"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip check
          "$RUNNER_TEMP/wheel-smoke/bin/custback" --help
          "$RUNNER_TEMP/wheel-smoke/bin/custback" avatar --smoke
          CUSTBACK_SKIP_INSTALL=1 npm install --ignore-scripts --prefix "$RUNNER_TEMP/npm-smoke" "$tarball"
          node "$RUNNER_TEMP/npm-smoke/node_modules/custback/packaging/npm/custback.js" --help

  artifact-validation:
    name: Artifact validation ${{ matrix.id }}
    needs: [artifact-build]
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ubuntu-x86_64-artifacts
            runner: '["ubuntu-latest"]'
          - id: macos-native-artifacts
            runner: '["macos-latest"]'
          - id: cuda-linux-x86_64-hardware
            runner: '["self-hosted","linux","x64","gpu","cuda"]'
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: custback-release-candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: Validate candidate provenance and files
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/candidate
        run: >-
          node -e 'const fs=require("fs"),path=require("path"),p=require("./scripts/release/phase6-evidence"),a=require("./scripts/release/assemble-evidence"),d=process.env.CANDIDATE_DIR,c=JSON.parse(fs.readFileSync(path.join(d,"candidate-manifest.json"))),m=p.loadManifest();a.validateCandidate(c,m,process.env);p.verifyArtifactFiles(c.artifacts,p.artifactPathsFromDirectory(c,d));'
      - name: Install all candidate formats without rebuilding them
        shell: bash
        run: |
          wheel="$(find "$RUNNER_TEMP/candidate" -maxdepth 1 -type f -name '*.whl' -print -quit)"
          sdist="$(find "$RUNNER_TEMP/candidate" -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          tarball="$(find "$RUNNER_TEMP/candidate" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          python -m pip install --disable-pip-version-check "$wheel"
          python -m pip check
          python -m pip download --disable-pip-version-check --no-deps --dest "$RUNNER_TEMP/sdist-check" "$sdist"
          CUSTBACK_SKIP_INSTALL=1 npm install --ignore-scripts --prefix "$RUNNER_TEMP/npm-check" "$tarball"

  migrations:
    name: Artifact migration ${{ matrix.id }}
    needs: [artifact-build]
    runs-on: ${{ matrix.os == 'ubuntu' && 'ubuntu-latest' || 'macos-latest' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ubuntu-migration-python-3.10-node-18
            os: ubuntu
            python: "3.10"
            node: "18"
          - id: ubuntu-migration-python-3.11-node-20
            os: ubuntu
            python: "3.11"
            node: "20"
          - id: ubuntu-migration-python-3.12-node-22
            os: ubuntu
            python: "3.12"
            node: "22"
          - id: ubuntu-migration-python-3.13-node-20
            os: ubuntu
            python: "3.13"
            node: "20"
          - id: ubuntu-migration-python-3.14-node-20
            os: ubuntu
            python: "3.14"
            node: "20"
          - id: macos-migration-python-3.12-node-20
            os: macos
            python: "3.12"
            node: "20"
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: custback-release-candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: custback-unpublished-reference-0.3.0
          path: ${{ runner.temp }}/reference
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - name: Validate candidate provenance and files
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/candidate
        run: >-
          node -e 'const fs=require("fs"),path=require("path"),p=require("./scripts/release/phase6-evidence"),a=require("./scripts/release/assemble-evidence"),d=process.env.CANDIDATE_DIR,c=JSON.parse(fs.readFileSync(path.join(d,"candidate-manifest.json"))),m=p.loadManifest();a.validateCandidate(c,m,process.env);p.verifyArtifactFiles(c.artifacts,p.artifactPathsFromDirectory(c,d));'
      - name: Qualify all migration contracts from the six exact artifacts
        shell: bash
        env:
          CUSTBACK_RELEASE_TMPDIR: ${{ runner.temp }}
        run: |
          wheel="$(find "$RUNNER_TEMP/candidate" -maxdepth 1 -type f -name '*.whl' -print -quit)"
          sdist="$(find "$RUNNER_TEMP/candidate" -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          tarball="$(find "$RUNNER_TEMP/candidate" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          reference_wheel="$RUNNER_TEMP/reference/custback-0.3.0-py3-none-any.whl"
          reference_sdist="$RUNNER_TEMP/reference/custback-0.3.0.tar.gz"
          reference_npm="$RUNNER_TEMP/reference/custback-0.3.0.tgz"
          node scripts/release/qualify-migrations.js \
            --matrix-id "${{ matrix.id }}" \
            --wheel "$wheel" \
            --sdist "$sdist" \
            --npm "$tarball" \
            --reference-wheel "$reference_wheel" \
            --reference-sdist "$reference_sdist" \
            --reference-npm "$reference_npm" \
            --report "$RUNNER_TEMP/migration-${{ matrix.id }}.json"
      - name: Retain the artifact-bound diagnostic migration report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: custback-migration-${{ matrix.id }}
          path: ${{ runner.temp }}/migration-${{ matrix.id }}.json
          if-no-files-found: error
          retention-days: 14

  ruff:
