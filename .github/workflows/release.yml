  stress:
    name: Stress ${{ matrix.id }}
    needs: [artifact-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: concurrent-patch-activation
            test: test_stress_concurrent_patch_activation
          - id: session-cancellation-reconnect
            test: test_stress_session_cancellation_reconnect
          - id: stream-connection-caps
            test: test_stress_stream_connection_caps
          - id: upload-reservations
            test: test_stress_upload_reservations
          - id: cleanup-retries
            test: test_stress_cleanup_retries
          - id: audio2face-shutdown
            test: test_stress_audio2face_shutdown
          - id: visual-generation-hot-changes
            test: test_stress_visual_generation_hot_changes
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: custback-release-candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: Validate candidate provenance and files
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/candidate
        run: >-
          node -e 'const fs=require("fs"),path=require("path"),p=require("./scripts/release/phase6-evidence"),a=require("./scripts/release/assemble-evidence"),d=process.env.CANDIDATE_DIR,c=JSON.parse(fs.readFileSync(path.join(d,"candidate-manifest.json"))),m=p.loadManifest();a.validateCandidate(c,m,process.env);p.verifyArtifactFiles(c.artifacts,p.artifactPathsFromDirectory(c,d));'
      - name: Run 100 deterministic iterations
        shell: bash
        run: |
          wheel="$(find "$RUNNER_TEMP/candidate" -maxdepth 1 -type f -name '*.whl' -print -quit)"
          python -m pip install --disable-pip-version-check "${wheel}[dev]"
          python -m pytest -q "tests/test_phase6_stress.py::${{ matrix.test }}"

  visual-qualification-deterministic:
    name: Deterministic visual qualification
    needs: [artifact-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
