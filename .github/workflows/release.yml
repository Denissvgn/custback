        include:
          - id: clean-host-repeat-a
            runner: '["self-hosted","linux","x64","phase6-clean-a"]'
          - id: clean-host-repeat-b
            runner: '["self-hosted","linux","x64","phase6-clean-b"]'
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: custback-release-candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: Validate candidate provenance and files
        env:
