      - name: Execute packaged scenario on the dedicated clean host
        run: >-
          python scripts/release/two-host-system-test.py
          --artifacts "$RUNNER_TEMP/candidate"
          --scenario "${{ matrix.id }}"
          --clean-host-evidence
          --result "$RUNNER_TEMP/clean-host-${{ matrix.id }}.json"
      - name: Retain the artifact-bound clean-host report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: custback-clean-host-${{ matrix.id }}
          path: ${{ runner.temp }}/clean-host-${{ matrix.id }}.json
          if-no-files-found: error
          retention-days: 14

  cuda-hardware:
    name: CUDA hardware execution
    needs: [artifact-build]
    runs-on: [self-hosted, linux, x64, gpu, cuda]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: custback-release-candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: Validate candidate provenance and files
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/candidate
        run: >-
          node -e 'const fs=require("fs"),path=require("path"),p=require("./scripts/release/phase6-evidence"),a=require("./scripts/release/assemble-evidence"),d=process.env.CANDIDATE_DIR,c=JSON.parse(fs.readFileSync(path.join(d,"candidate-manifest.json"))),m=p.loadManifest();a.validateCandidate(c,m,process.env);p.verifyArtifactFiles(c.artifacts,p.artifactPathsFromDirectory(c,d));'
      - name: Require real CUDA execution from the wheel
        shell: bash
        run: |
          wheel="$(find "$RUNNER_TEMP/candidate" -maxdepth 1 -type f -name '*.whl' -print -quit)"
          python -m pip install --disable-pip-version-check "${wheel}[gpu]"
          python -m pip check
          python -c 'import json,subprocess,sys; r=json.loads(subprocess.check_output([sys.executable,"-m","custback.gpu_probe","--json"])); assert r["cuda_provider"] and r["cuda_inference"] and r["profile_verified"], r'

  phase6-evidence:
    name: Assemble same-run Phase 6 evidence
    if: ${{ always() }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    needs:
      - python-core
      - opencv-compatibility
      - dependency-bounds
      - optional-backends
      - audio2face-contract
      - node
      - package-smoke
      - artifact-build
      - artifact-validation
      - migrations
      - ruff
      - stress
      - visual-qualification-deterministic
      - clean-tree
      - two-host-tls
      - two-clean-hosts
      - cuda-hardware
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: Evaluate every required dependency conclusion
        env:
          CUSTBACK_JOB_RESULTS: ${{ toJSON(needs) }}
        run: >-
          node -e 'const a=require("./scripts/release/assemble-evidence"),p=require("./scripts/release/phase6-evidence");a.validateJobNeeds(JSON.parse(process.env.CUSTBACK_JOB_RESULTS),p.loadManifest());'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: custback-release-candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: custback-unpublished-reference-0.3.0
          path: ${{ runner.temp }}/reference
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: custback-migration-*
          path: ${{ runner.temp }}/migration-reports
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: custback-two-host-*
          path: ${{ runner.temp }}/two-host-reports
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: custback-clean-host-*
          path: ${{ runner.temp }}/clean-host-reports
          merge-multiple: true
      - name: Validate real reports and create the exact qualification report
        run: >-
          node scripts/release/assemble-evidence.js template
          "$RUNNER_TEMP/candidate/candidate-manifest.json"
          "$RUNNER_TEMP/migration-reports"
          "$RUNNER_TEMP/reference"
          "$RUNNER_TEMP/two-host-reports"
          "$RUNNER_TEMP/clean-host-reports"
          "$RUNNER_TEMP/qualification.json"
      - name: Assemble exact same-run evidence
        env:
          CUSTBACK_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/release/assemble-evidence.js assemble "$RUNNER_TEMP/candidate/candidate-manifest.json" "$RUNNER_TEMP/qualification.json" "$RUNNER_TEMP/phase6-evidence.json"
      - name: Attest the exact same-run evidence document
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-path: ${{ runner.temp }}/phase6-evidence.json
      - name: Validate trusted evidence and candidate files
        run: node scripts/release/phase6-evidence.js validate-trusted "$RUNNER_TEMP/phase6-evidence.json" "$RUNNER_TEMP/candidate"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: custback-phase6-evidence
          path: ${{ runner.temp }}/phase6-evidence.json
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false

  release-gate:
    name: Aggregate production release gate
    if: ${{ always() }}
    permissions:
      contents: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
    needs:
      - python-core
      - opencv-compatibility
      - dependency-bounds
      - optional-backends
      - audio2face-contract
      - node
      - package-smoke
      - artifact-build
      - artifact-validation
      - migrations
      - ruff
      - stress
      - visual-qualification-deterministic
      - clean-tree
      - two-host-tls
      - two-clean-hosts
      - cuda-hardware
      - phase6-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: Refuse missing, extra, skipped, cancelled, or failed jobs
        env:
          CUSTBACK_JOB_RESULTS: ${{ toJSON(needs) }}
        run: >-
          node -e 'const m=require("./scripts/release/phase6-evidence").loadManifest(),n=JSON.parse(process.env.CUSTBACK_JOB_RESULTS),a=Object.keys(n).sort(),e=[...m.workflow.required_job_ids].sort();if(JSON.stringify(a)!==JSON.stringify(e))throw Error("release-gate needs do not match required-gates.json");for(const id of e)if(!n[id]||n[id].result!=="success")throw Error(`required job ${id} concluded ${n[id]&&n[id].result}`);'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: custback-release-candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: custback-phase6-evidence
          path: ${{ runner.temp }}/evidence
      - name: Verify GitHub artifact attestations
        shell: bash
        run: |
          for artifact in "$RUNNER_TEMP"/candidate/*.whl "$RUNNER_TEMP"/candidate/*.tar.gz "$RUNNER_TEMP"/candidate/*.tgz; do
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --signer-digest "$GITHUB_SHA" \
              --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners
          done
      - name: Verify authenticated exact-commit evidence
        run: node scripts/release/phase6-evidence.js validate-trusted "$RUNNER_TEMP/evidence/phase6-evidence.json" "$RUNNER_TEMP/candidate"

  publish:
    name: Publish the already-qualified files
    needs: [release-gate]
    if: ${{ needs.release-gate.result == 'success' && github.event_name == 'push' && github.ref_type == 'tag' && github.ref_protected && vars.CUSTBACK_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      CUSTBACK_PUBLISH_ENABLED: ${{ vars.CUSTBACK_PUBLISH_ENABLED }}
    environment:
      name: production
      url: https://pypi.org/project/custback/
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: custback-release-candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: custback-phase6-evidence
          path: ${{ runner.temp }}/evidence
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
      - name: Revalidate downloaded publication payload
        run: node scripts/release/phase6-evidence.js validate-trusted "$RUNNER_TEMP/evidence/phase6-evidence.json" "$RUNNER_TEMP/candidate"
      - name: Require an enabled protected tag from main
        shell: bash
        run: |
          node scripts/release/phase6-evidence.js authorize-publication
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Reverify GitHub artifact attestations
        shell: bash
        run: |
          for artifact in "$RUNNER_TEMP"/candidate/*.whl "$RUNNER_TEMP"/candidate/*.tar.gz "$RUNNER_TEMP"/candidate/*.tgz; do
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --signer-digest "$GITHUB_SHA" \
              --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners
          done
      - name: Upload exact wheel and sdist
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "twine>=5,<7"
          wheel="$(find "$RUNNER_TEMP/candidate" -maxdepth 1 -type f -name '*.whl' -print -quit)"
          sdist="$(find "$RUNNER_TEMP/candidate" -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          python -m twine upload --non-interactive "$wheel" "$sdist"
      - name: Upload exact npm tarball
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          tarball="$(find "$RUNNER_TEMP/candidate" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          npm publish "$tarball" --access public --provenance
