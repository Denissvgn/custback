          node -e 'const fs=require("fs"),path=require("path"),p=require("./scripts/release/phase6-evidence"),a=require("./scripts/release/assemble-evidence"),d=process.env.CANDIDATE_DIR,c=JSON.parse(fs.readFileSync(path.join(d,"candidate-manifest.json"))),m=p.loadManifest();a.validateCandidate(c,m,process.env);p.verifyArtifactFiles(c.artifacts,p.artifactPathsFromDirectory(c,d));'
      - run: node scripts/release/verify-clean-tree.js

  two-host-tls:
    name: Two-host TLS ${{ matrix.id }}
