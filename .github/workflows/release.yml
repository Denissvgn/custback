          - id: control-expired-certificate
          - id: control-wrong-host-certificate
          - id: renderer-firewall-path-removed
          - id: control-firewall-path-removed
          - id: renderer-reconnect
          - id: credential-and-ca-rotation
          - id: privacy-slate-startup
          - id: privacy-slate-frame-plane-failure
          - id: control-error-mapping
          - id: failed-tls-handshake-no-payload
          - id: clean-host-repeat-a
          - id: clean-host-repeat-b
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
