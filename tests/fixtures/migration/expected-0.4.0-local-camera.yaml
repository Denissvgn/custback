schema_version: 1
camera:
  device: 0
  width: 1280
  height: 720
  fps: 30
  mirror: false
  synthetic: false
  fit_mode: stretch
  anchor_x: 0.5
  anchor_y: 0.5
  rotation: 0
background:
  mode: camera
  blur_strength: 31
  image_path: ''
  video_path: ''
  color:
  - 18
  - 100
  - 32
  remote_fallback_mode: blur
  camera_target: legacy-camera
  fit_mode: cover
  anchor_x: 0.5
  anchor_y: 0.5
  video_color_matrix: auto
  video_color_range: auto
  video_color_primaries: auto
  video_color_transfer: auto
backdrop_targets:
  legacy-camera:
    source: /dev/video2
segmentation:
  backend: auto
  model_path: ''
  delegate: cpu
  rvm_downsample: 0.0
  threshold: 0.5
  mask_blur: 7
  edge_refine: true
  mask_shift: 0
  temporal_smoothing: 0.35
compositing:
  light_wrap: 0.25
  use_model_foreground: true
  blend_space: srgb_legacy
  color_correction:
    mode: 'off'
    strength: 0.5
    exposure_limit_ev: 0.85
    white_balance_strength: 0.5
    adaptation_time_s: 0.8
output:
  backend: auto
  device: ''
  fps: 30
  preview: false
  width: null
  height: null
api:
  enabled: true
  host: 127.0.0.1
  port: 8710
  remote_timeout_ms: 250
  allow_non_loopback: false
  allowed_origins: []
  token_file: ~/.config/custback/api-token
  session_ttl_s: 28800
  tls_certfile: ''
  tls_keyfile: ''
  ws_max_bytes: 16777216
  uploads:
    image_max_bytes: 20971520
    video_max_bytes: 268435456
    image_max_pixels: 16777216
    video_max_width: 3840
    video_max_height: 2160
    storage_max_bytes: 2147483648
    max_files: 100
