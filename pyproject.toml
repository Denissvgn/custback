[build-system]
requires = ["setuptools>=68,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "custback"
version = "0.4.0"
description = "Virtual camera with background replacement for meeting apps (Ubuntu / macOS)"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24,<3",
    "opencv-contrib-python>=4.8,<6",
    "pillow>=10,<13",
    "pydantic>=2.7,<3",
    "pyvirtualcam>=0.11,<1",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "pyyaml>=6.0,<7",
    "websockets>=12.0,<17",
    "python-multipart>=0.0.9,<1",
    "httpx>=0.27,<0.29",
]

[project.optional-dependencies]
# MediaPipe provides the production-quality person segmenter.
# Without it, custback falls back to a simple heuristic segmenter.
mediapipe = ["mediapipe>=0.10.14,<0.11"]
# Robust Video Matting backend: best edge quality (true alpha matting),
# CPU inference via onnxruntime.
rvm = ["onnxruntime>=1.17,<2"]
# Same, accelerated on NVIDIA GPUs (CUDA 12 execution provider).
# ONNX Runtime 1.27 switched the Python 3.14 Linux wheel to CUDA 13, while
# custback's supported GPU runtime line remains CUDA 12.
gpu = ["onnxruntime-gpu>=1.17,<1.27"]
# Audio-driven avatar animation via an NVIDIA Audio2Face-3D gRPC endpoint
# (pip-level extra; the npm installer's CUSTBACK_EXTRAS does not cover it).
# The vision avatar driver uses the mediapipe extra above instead.
audio2face = [
    "grpcio>=1.60,<2",
    "nvidia-ace>=1.2,<2",
    "sounddevice>=0.4,<0.6",
]
dev = [
    "build>=1.2,<2",
    "pytest>=8.0,<10",
    "pytest-timeout>=2.3,<3",
    "httpx>=0.27,<0.29",
    "httpx2>=2,<3",
]

[project.scripts]
custback = "custback.__main__:main"
custback-avatar = "custback.avatar.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
timeout_method = "thread"
