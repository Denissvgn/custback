[build-system]
requires = ["setuptools>=77,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "custback"
version = "0.4.0"
description = "Virtual camera with background replacement for meeting apps (Ubuntu / Debian / macOS)"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.24,<3",
    "opencv-contrib-python>=4.8,<6",
    "av>=17,<18; python_version < '3.11'",
    "av>=18,<19; python_version >= '3.11'",
    "pillow>=10,<13",
    "pydantic>=2.7,<3",
    "pyvirtualcam>=0.11,<1; sys_platform != 'win32' or (platform_machine != 'ARM64' and platform_machine != 'arm64')",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "pyyaml>=6.0,<7",
    "websockets>=12.0,<17",
    "python-multipart>=0.0.9,<1",
    "httpx>=0.27,<0.29",
]

[project.optional-dependencies]
# MediaPipe provides the confidence-mask segmentation quality tier.
# Without it or RVM, custback falls back to the heuristic quality tier.
mediapipe = ["mediapipe>=0.10.14,<0.11"]
# Robust Video Matting backend: best edge quality (true alpha matting),
# CPU inference via onnxruntime.
rvm = ["onnxruntime>=1.17,<2"]
# Same, accelerated on NVIDIA GPUs (CUDA 12 execution provider).
# ONNX Runtime 1.27 switched the Python 3.14 Linux wheel to CUDA 13, while
# custback's supported GPU runtime line remains CUDA 12.
gpu = ["onnxruntime-gpu>=1.17,<1.27"]
# Windows-only: RVM on any Windows GPU via the DirectML execution provider
# (WIN-6.2). Mutually exclusive with `gpu`: both wheels provide the same
# `onnxruntime` import and must never share an environment — the frozen
# installer picks exactly one profile, and the WIN-6.2 release gate
# (scripts/release/windows-acceleration-gate.py) fails on co-installation.
# Unadvertised until that gate passes on AMD and Intel hardware.
directml = ["onnxruntime-directml>=1.17,<2"]
# Windows filesystem-security backend (custback._platform.windows): the
# LockFileEx/owner-only-DACL/reparse-rejection/SID/MoveFileEx primitives that
# replace the POSIX fcntl/fchmod/O_NOFOLLOW/geteuid contract (Phase 2, WIN-2.x).
# Required whenever custback runs on Windows; bundled by the frozen installer.
windows = ["pywin32>=306"]
# Audio-driven avatar animation via an NVIDIA Audio2Face-3D gRPC endpoint.
# NVIDIA's published protocol wheels have a narrow grpc/protobuf intersection.
# This extra cannot be combined with mediapipe, which requires protobuf<5.
audio2face = [
    "grpcio>=1.67,<1.67.2",
    "nvidia-ace==1.0.0",
    "nvidia-audio2face-3d==1.3.0",
    "protobuf>=5.29.3,<6",
    "sounddevice>=0.4,<0.6",
]
dev = [
    "build>=1.2,<2",
    "pytest>=8.0,<10",
    "pytest-timeout>=2.3,<3",
    "httpx>=0.27,<0.29",
    "httpx2>=2,<3",
    # Exact pin, not a range: ruff's formatter style is only stable within a
    # single version before 1.0, so `ruff format --check` is a deterministic
    # gate only when the version is fixed. Bump deliberately (reformat + repin
    # required-version + the release-gate allowlist in the same commit).
    "ruff==0.15.22",
    # Exact pin keeps Pyright's diagnostics stable across CI runs. Bump only
    # after running the new version across the complete pyrightconfig include.
    "pyright==1.1.411",
]

[project.scripts]
custback = "custback.__main__:main"
custback-avatar = "custback.avatar.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"custback" = ["default.yaml"]
"custback.avatar" = ["avatar.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
timeout_method = "thread"

[tool.ruff]
# Exact-match the pinned dev dependency so ruff refuses to run under any other
# version — the format gate cannot silently drift when a different ruff resolves.
required-version = "==0.15.22"
target-version = "py310"
line-length = 88
src = ["src", "tests", "examples", "scripts/release"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# These tests intentionally import optional dependencies after importorskip.
"tests/*.py" = ["E402"]
"src/custback/preview.py" = ["E402"]
# Narrow, reviewed pre-Phase-6 debt; new files receive the complete ruleset.
"src/custback/avatar/api.py" = ["F401"]
"tests/test_api_security.py" = ["F401"]
"tests/test_capture.py" = ["F401"]
"tests/test_phase5_storage.py" = ["F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = false
